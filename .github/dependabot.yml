# Dependabot for the umbrella: only what lives in this repository — GitHub Actions and
# the images pinned in compose.yml. Component dependencies are updated in their repositories.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: compose
