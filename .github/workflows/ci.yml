# Umbrella CI. Component tests run here, not only in their own repositories:
# control-plane, memory-service, notification-service, skill-sdk and package-sdk take their
# neighbours (platform-auth-sdk, platform-llm, the core, the core client, skill-sdk) as path
# dependencies and do not build in a standalone checkout. A checkout with submodules gives
# everyone neighbours at pinned revisions.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.8.0"

jobs:
  python:
    name: ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: platform-auth-sdk
            tests: tests
          - component: platform-llm
            tests: tests
          - component: skill-sdk
            tests: tests
            extra: --all-extras
          # The moved tools' tests run on the component's fixture snapshot of the packages: the
          # umbrella ships only packages/example, and the suite expects the platform packages.
          - component: package-sdk
            tests: tests
            extra: --all-extras
          - component: iam-service
            tests: tests
          - component: memory-service
            tests: tests --ignore=tests/integration
            extra: --extra mcp
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: uv sync ${{ matrix.extra }} --all-groups 2>/dev/null || uv sync ${{ matrix.extra }} --dev
      - name: ruff
        working-directory: ${{ matrix.component }}
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: pytest
        working-directory: ${{ matrix.component }}
        run: uv run ${{ matrix.extra }} pytest -q ${{ matrix.tests }}
      - name: Umbrella packages against the package schema
        if: matrix.component == 'package-sdk'
        working-directory: package-sdk
        env:
          PACKAGE_SDK_UMBRELLA: ${{ github.workspace }}
        run: uv run ${{ matrix.extra }} pytest -q tests/test_umbrella_packages.py

  control-plane:
    name: control-plane (all tests, PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: control_plane
          POSTGRES_PASSWORD: control_plane
          POSTGRES_DB: control_plane_test
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U control_plane -d control_plane_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: ruff + pytest (unit, client, integration, concurrency)
        working-directory: control-plane
        env:
          CP_TEST_DATABASE_URL: postgresql+psycopg://control_plane:control_plane@localhost:5434/control_plane_test
        run: |
          uv sync --all-groups 2>/dev/null || uv sync --dev
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q tests/unit tests/client tests/integration tests/concurrency
      - name: skill-sdk through the core skill executor
        working-directory: control-plane
        run: |
          PYTHONPATH=../skill-sdk/src:../skill-sdk uv run pytest -q -p no:cacheprovider \
            -c ../skill-sdk/pyproject.toml ../skill-sdk/tests/test_executor_e2e.py
      - name: Catalog packages with the core's validators (package-sdk)
        # The package SDK from its submodule in the core's environment: the core's code at the revision tested above
        env:
          PYTHONPATH: ${{ github.workspace }}/package-sdk/src
        run: uv run --project control-plane python -m package_sdk.cli check --install deploy/packages.yaml

  notification-service:
    name: notification-service (all tests, PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: notify
          POSTGRES_PASSWORD: notify
          POSTGRES_DB: notify_test
        ports: ["5438:5432"]
        options: >-
          --health-cmd "pg_isready -U notify -d notify_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: ruff + pytest
        working-directory: notification-service
        env:
          NS_TEST_DATABASE_URL: postgresql+psycopg://notify:notify@localhost:5438/notify_test
        run: |
          uv sync --all-groups 2>/dev/null || uv sync --dev
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q

  umbrella:
    name: umbrella (tools, compose, links, oss-check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # oss-check inspects the history reachable from the revision (gitleaks)
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: ruff + tests of tools/
        run: |
          uvx ruff check tools deploy
          uvx ruff format --check tools deploy
          uv run --no-project --with pytest python -m pytest -q tools/tests
      - name: Compose interpolation with all profiles
        run: |
          cp .env.example .env
          python3 tools/fill_secrets.py .env
          mkdir -p secrets && touch secrets/iam-signing.pem
          docker compose --profile core --profile notify --profile idp --profile edge config --quiet
      - name: Catalog packages (schema and references, without the core's code)
        # The package SDK is the package-sdk submodule; the core's validators run in the control-plane job
        run: |
          PYTHONPATH=package-sdk/src uv run --no-project --with pyyaml --with jsonschema \
            python -m package_sdk.cli check --schema-only --install deploy/packages.yaml
      - name: Documentation links
        run: python3 tools/linkcheck.py
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - name: oss-check umbrella
        # The private stop-list is the OSS_CHECK_STOPLIST secret (one regular expression per line);
        # without it, licences, document language and gitleaks are checked.
        env:
          OSS_CHECK_STOPLIST: ${{ secrets.OSS_CHECK_STOPLIST }}
        run: python3 tools/oss_check.py . --ref HEAD

  guide:
    name: guide guide/ (mkdocs --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: make guide
        run: |
          if [ ! -f guide/mkdocs.yml ]; then echo "no guide/ yet — skipping"; exit 0; fi
          make guide

  quickstart:
    name: quickstart from a clean clone (core edge)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Platform tag criterion: the README steps
    # make secrets → make up → make bootstrap → make smoke pass on a clean machine.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # make bootstrap runs through uv: step 5b (catalog from packages) needs PyYAML and jsonschema
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: make secrets
        run: |
          make secrets
          sudo chown 10001:10001 secrets/*.pem && sudo chmod 600 secrets/*.pem
      - name: make up PROFILES="core edge"
        run: |
          start=$(date +%s)
          make up PROFILES="core edge"
          echo "build+up: $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Wait for healthz
        run: |
          for i in $(seq 1 60); do make smoke >/dev/null 2>&1 && break; sleep 5; done
          make smoke
      - name: make bootstrap (twice — idempotency)
        run: |
          make bootstrap
          sudo test -f secrets/harness-pat || { echo "bootstrap did not issue a PAT"; exit 1; }
          make bootstrap
      - name: Restart the core after bootstrap, then smoke
        run: |
          docker compose --profile core --profile edge up -d control-plane-api control-plane-worker context-adapter
          for i in $(seq 1 60); do make smoke >/dev/null 2>&1 && break; sleep 5; done
          make smoke
          docker stats --no-stream --format '{{.Name}} {{.MemUsage}}' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Logs on failure
        if: failure()
        run: docker compose --profile "*" logs --tail 200
