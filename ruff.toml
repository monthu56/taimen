# ruff for the umbrella scripts (tools/, deploy/); the components have their own settings.
line-length = 120
target-version = "py311"
extend-exclude = [
  "control-plane", "memory-service", "iam-service", "platform-auth-sdk",
  "notification-service", "skill-sdk", "platform-llm", "guide",
]

[lint]
select = ["E", "F", "W", "I", "UP", "B"]

# tools/cp_packages.py, pkg.py and package_sandbox.py are projected from the private superproject as is (single source);
# style is fixed there, not in the copy.
[lint.per-file-ignores]
"tools/cp_packages.py" = ["E501", "B023", "UP017"]
"tools/pkg.py" = ["E501", "B023", "UP017", "E402"]
"tools/package_sandbox.py" = ["E501", "B023", "UP017", "E402"]

[format]
exclude = ["tools/cp_packages.py", "tools/pkg.py", "tools/package_sandbox.py"]
