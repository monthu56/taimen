# gitleaks for the umbrella: the default rules plus narrow exceptions for known
# examples in the guide (a truncated JWT with an ellipsis, an idempotency key).
[extend]
useDefault = true

[allowlist]
description = "Example values in guide/"
regexes = [
  '''eyJhbGciOiJSUzI1NiIsImtpZCI6\.\.\.''',
  '''invoice-42-approved''',
]
